[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "self-correcting-rag"
version = "0.1.0"
description = "A Self-RAG system for summarizing books and answering questions from PDFs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdf>=6.14,<7.0",
]

[project.scripts]
self-rag = "self_correcting_rag.cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.0,<6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"